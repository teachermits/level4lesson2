<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Free-Time Chat Challenge</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9; /* slate-100 */
            -webkit-tap-highlight-color: transparent;
        }

        /* App Container mimicking mobile frame */
        #app-container {
            max-width: 480px;
            margin: 0 auto;
            height: 100vh;
            height: 100dvh; /* for mobile browsers */
            background-color: #ffffff;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 481px) {
            #app-container {
                height: 90vh;
                margin-top: 5vh;
                border-radius: 24px;
            }
        }

        /* Hide scrollbar for clean app look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }

        /* Animations */
        .screen-enter {
            animation: slideIn 0.3s ease-out forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .typing-dot {
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Chat bubbles */
        .chat-bubble-received {
            border-bottom-left-radius: 4px;
        }
        .chat-bubble-sent {
            border-bottom-right-radius: 4px;
        }

        .word-match-success { color: #16a34a; font-weight: 700; }
        .word-match-fail { color: #ef4444; font-weight: 700; text-decoration: underline wavy; }
        
        .print-only { display: none; }
        
        @media print {
            body { background: white; }
            #app-container { box-shadow: none; max-width: 100%; height: auto; border-radius: 0; margin-top: 0; }
            .no-print { display: none !important; }
            .print-only { display: block; }
            #screen-report { height: auto; overflow: visible; }
        }
    </style>
</head>
<body>

    <div id="app-container">
        
        <!-- Header / Progress (Hidden on Start/Report) -->
        <header id="app-header" class="hidden bg-indigo-600 text-white p-4 shadow-md z-10 shrink-0">
            <div class="flex justify-between items-center mb-2">
                <h1 class="text-sm font-bold truncate">Free-Time Chat Challenge</h1>
                <span id="mission-counter" class="text-xs font-semibold bg-indigo-800 px-2 py-1 rounded-full">Mission 1/4</span>
            </div>
            <div class="w-full bg-indigo-300 rounded-full h-1.5">
                <div id="progress-bar" class="bg-emerald-400 h-1.5 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </header>

        <!-- Dynamic Content Area -->
        <main id="app-content" class="flex-1 overflow-y-auto no-scrollbar relative bg-slate-50 relative p-4 pb-24"></main>

        <!-- Global Message/Toast Overlay -->
        <div id="toast-container" class="absolute top-20 left-0 right-0 z-50 flex justify-center pointer-events-none opacity-0 transition-opacity duration-300">
            <div id="toast-message" class="bg-slate-800 text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 mx-4">
                <i id="toast-icon" class="fas fa-info-circle"></i>
                <span id="toast-text" class="text-sm font-medium">Message</span>
            </div>
        </div>

        <!-- Custom Modal -->
        <div id="modal-overlay" class="absolute inset-0 bg-slate-900/50 z-50 hidden flex items-center justify-center backdrop-blur-sm p-4">
            <div id="modal-content" class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 transform scale-95 transition-transform duration-200">
                <!-- Modal content injected via JS -->
            </div>
        </div>

        <!-- Footer / Hidden Teacher Button -->
        <footer class="absolute bottom-0 w-full p-2 text-center text-xs text-slate-400 z-0 bg-slate-50 no-print">
            Social Chat Simulation
            <button onclick="app.showTeacherMode()" class="opacity-10 ml-2 p-2 hover:opacity-100 transition-opacity" aria-label="Teacher Mode"><i class="fas fa-cog"></i></button>
        </footer>

    </div>

    <script>
        const TOTAL_MISSIONS = 4;
        
        const state = {
            studentName: '',
            currentMission: 0,
            currentStep: 0,
            scores: {
                grammar: { points: 0, total: 0 },
                accuracy: { points: 0, total: 0 }, // Replaces speaking clarity
                communication: { points: 0, total: 0 }
            },
            surveyData: []
        };

        // DOM Elements
        const DOM = {
            content: document.getElementById('app-content'),
            header: document.getElementById('app-header'),
            progressBar: document.getElementById('progress-bar'),
            missionCounter: document.getElementById('mission-counter'),
            toast: document.getElementById('toast-container'),
            toastText: document.getElementById('toast-text'),
            toastIcon: document.getElementById('toast-icon'),
            modalOverlay: document.getElementById('modal-overlay'),
            modalContent: document.getElementById('modal-content')
        };

        const Lingua = {
            clean(text) {
                return text.toLowerCase().replace(/[.,?!'"]/g, '').trim().replace(/\s+/g, ' ');
            },
            
            // Text accuracy checker (did they spell the target words right?)
            calculateAccuracy(target, typed) {
                const targetWords = this.clean(target).split(' ');
                const typedWords = this.clean(typed).split(' ');
                let matchCount = 0;
                
                targetWords.forEach(word => {
                    if (typedWords.includes(word)) matchCount++;
                });
                
                return Math.round((matchCount / targetWords.length) * 100);
            },

            // Specific grammar check for this lesson: like/love/enjoy/hate + V-ing
            checkGerundGrammar(text) {
                const t = this.clean(text);
                const prefs = ['like', 'love', 'enjoy', 'hate'];
                
                // Common base verbs that students forget to add -ing to
                const commonVerbs = [
                    {base: 'play', gerund: 'playing'},
                    {base: 'read', gerund: 'reading'},
                    {base: 'dance', gerund: 'dancing'},
                    {base: 'watch', gerund: 'watching'},
                    {base: 'listen', gerund: 'listening'},
                    {base: 'swim', gerund: 'swimming'},
                    {base: 'cook', gerund: 'cooking'},
                    {base: 'do', gerund: 'doing'},
                    {base: 'clean', gerund: 'cleaning'},
                    {base: 'go', gerund: 'going'}
                ];

                const hasPref = prefs.some(p => t.includes(p));
                if (!hasPref && !t.includes("don't like")) {
                    return { ok: false, type: 'missing_pref', msg: "I didn't see a preference word (like, love, enjoy, hate). Try again." };
                }

                for (let v of commonVerbs) {
                    // Check for "like play", "enjoy to play"
                    let prefRegex = new RegExp(`(${prefs.join('|')})\\s+(to\\s+)?${v.base}\\b`, 'i');
                    if (prefRegex.test(t)) {
                        return { 
                            ok: false, 
                            type: 'missing_gerund',
                            msg: `Remember the rule! Use the <b>-ing</b> form after the preference word.`,
                            suggestion: `Try: "... <b>${v.gerund}</b>"` 
                        };
                    }
                }
                
                // Ensure a gerund is present if a preference word is there
                const hasIng = /\w+ing\b/.test(t);
                if (hasPref && !hasIng) {
                    return {
                        ok: false,
                        type: 'no_ing',
                        msg: "You used a preference word, but I don't see an activity ending in <b>-ing</b>.",
                        suggestion: "Make sure your activity verb ends in -ing (e.g., play<b>ing</b>)."
                    }
                }

                // Basic check passed
                return { ok: true, msg: "Excellent grammar!" };
            }
        };

        const UI = {
            showToast(message, type = 'info') {
                DOM.toastText.innerHTML = message;
                DOM.toastIcon.className = type === 'success' ? 'fas fa-check-circle text-emerald-400' : 
                                          type === 'error' ? 'fas fa-exclamation-triangle text-rose-400' : 
                                          'fas fa-info-circle text-blue-400';
                DOM.toast.classList.remove('opacity-0', 'pointer-events-none');
                setTimeout(() => {
                    DOM.toast.classList.add('opacity-0', 'pointer-events-none');
                }, 3000);
            },

            showModal(contentHTML) {
                DOM.modalContent.innerHTML = contentHTML;
                DOM.modalOverlay.classList.remove('hidden');
                setTimeout(() => DOM.modalContent.classList.remove('scale-95'), 10);
            },

            closeModal() {
                DOM.modalContent.classList.add('scale-95');
                setTimeout(() => {
                    DOM.modalOverlay.classList.add('hidden');
                    DOM.modalContent.innerHTML = '';
                }, 200);
            },

            updateProgress(missionIndex) {
                if(missionIndex === 0) {
                    DOM.header.classList.add('hidden');
                    return;
                }
                DOM.header.classList.remove('hidden');
                DOM.missionCounter.textContent = `Mission ${missionIndex}/${TOTAL_MISSIONS}`;
                const pct = ((missionIndex - 1) / TOTAL_MISSIONS) * 100;
                DOM.progressBar.style.width = `${pct}%`;
            },
            
            updateScore(category, points, maxPoints = 10) {
                state.scores[category].points += points;
                state.scores[category].total += maxPoints;
            },
            
            getScorePercentage(category) {
                const s = state.scores[category];
                if (s.total === 0) return 100;
                return Math.round((s.points / s.total) * 100);
            },
            
            getTotalPercentage() {
                let totalP = 0, totalT = 0;
                for(let key in state.scores) {
                    totalP += state.scores[key].points;
                    totalT += state.scores[key].total;
                }
                // Add completion score (10 points for completing all missions)
                totalP += state.currentMission >= TOTAL_MISSIONS ? 10 : 0;
                totalT += 10;
                return Math.round((totalP / totalT) * 100);
            }
        };

        const Screens = {
            
            // ---------------- START SCREEN ----------------
            renderWelcome() {
                UI.updateProgress(0);
                DOM.content.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-center p-6 screen-enter">
                        <div class="bg-indigo-100 p-6 rounded-full mb-6 text-indigo-600 shadow-inner">
                            <i class="fas fa-mobile-alt text-5xl"></i>
                        </div>
                        <h1 class="text-3xl font-extrabold text-slate-800 mb-2 leading-tight">FREE-TIME<br><span class="text-indigo-600">CHAT CHALLENGE</span></h1>
                        <p class="text-slate-600 mb-8 font-medium">Can you survive 4 digital conversation missions?</p>
                        
                        <div class="bg-white p-6 rounded-2xl shadow-md w-full border border-slate-100 mb-8">
                            <p class="text-sm text-slate-600 mb-4">Today you will read, write, and chat about the activities you <span class="font-bold text-slate-800">love, enjoy, like, and hate</span>.</p>
                            <input type="text" id="student-name-input" placeholder="Type your first name" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-4 text-center font-semibold text-lg">
                        </div>
                        
                        <button onclick="app.startChallenge()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-6 rounded-xl shadow-lg transition-transform active:scale-95 text-lg flex items-center justify-center gap-2">
                            START CHALLENGE <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                `;
                
                // Add enter key support for the name input
                setTimeout(() => {
                    const nameInput = document.getElementById('student-name-input');
                    if (nameInput) {
                        nameInput.addEventListener('keypress', function (e) {
                            if (e.key === 'Enter') {
                                app.startChallenge();
                            }
                        });
                    }
                }, 100);
            },

            // ---------------- GRAMMAR DETECTIVE ----------------
            renderGrammarDetective() {
                DOM.content.innerHTML = `
                    <div class="screen-enter flex flex-col items-center justify-center h-full text-center p-4">
                        <div class="bg-amber-100 p-4 rounded-full text-amber-600 mb-6">
                            <i class="fas fa-lightbulb text-4xl"></i>
                        </div>
                        <h2 class="text-2xl font-bold text-slate-800 mb-2">Before We Chat...</h2>
                        <p class="text-slate-600 mb-8">Remember the pattern for talking about free time online!</p>
                        
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 w-full mb-8 text-left">
                            <p class="font-mono text-lg mb-2">I LOVE danc<span class="text-indigo-600 font-bold bg-indigo-100 px-1 rounded">ing</span>.</p>
                            <p class="font-mono text-lg mb-2">I HATE wait<span class="text-indigo-600 font-bold bg-indigo-100 px-1 rounded">ing</span>.</p>
                            <p class="font-mono text-lg mb-4">I ENJOY read<span class="text-indigo-600 font-bold bg-indigo-100 px-1 rounded">ing</span>.</p>
                            
                            <p class="font-bold text-slate-700 mt-6 mb-3 text-center border-t pt-4">THE CHAT CODE:</p>
                            <div class="bg-indigo-50 p-3 rounded-lg border border-indigo-100 text-center font-bold text-indigo-800 shadow-inner">
                                like / love / enjoy / hate + VERB-ING
                            </div>
                        </div>
                        
                        <button onclick="app.renderMission1()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-md transition-transform active:scale-95">
                            Got it! Start Mission 1
                        </button>
                    </div>
                `;
            },

            // ---------------- MISSION 1: SOCIAL FEED ----------------
            renderMission1() {
                state.currentMission = 1;
                UI.updateProgress(1);
                
                const posts = [
                    { author: 'Sarah', icon: '⚽', imgColor: 'bg-emerald-400', content: 'Beautiful day for a match! ☀️', instruction: 'Tell Sarah you LOVE playing soccer.', keyword: 'love' },
                    { author: 'David', icon: '📚', imgColor: 'bg-blue-400', content: 'Finally finished this novel.', instruction: 'Tell David you ENJOY reading.', keyword: 'enjoy' },
                    { author: 'Emma', icon: '🧹', imgColor: 'bg-rose-400', content: 'Sunday chores... ugh.', instruction: 'Tell Emma you HATE cleaning.', keyword: 'hate' }
                ];
                
                let pIndex = state.currentStep || 0;
                if (pIndex >= posts.length) {
                    state.currentStep = 0;
                    this.renderMission2();
                    return;
                }
                
                const post = posts[pIndex];

                DOM.content.innerHTML = `
                    <div class="screen-enter flex flex-col h-full">
                        <div class="mb-4">
                            <h2 class="text-xl font-bold text-slate-800"><i class="fas fa-hashtag text-indigo-500 mr-2"></i>Mission 1: Social Feed</h2>
                            <p class="text-sm text-slate-500 mt-1">Leave a comment using the correct grammar.</p>
                        </div>
                        
                        <div class="flex-1 flex flex-col gap-4">
                            <!-- Social Post Card -->
                            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                <div class="p-4 flex items-center gap-3 border-b border-slate-50">
                                    <div class="w-10 h-10 rounded-full ${post.imgColor} flex items-center justify-center text-white font-bold text-lg">
                                        ${post.author[0]}
                                    </div>
                                    <div>
                                        <h3 class="font-bold text-slate-800 leading-tight">${post.author}</h3>
                                        <p class="text-xs text-slate-400">2 hours ago</p>
                                    </div>
                                </div>
                                <div class="p-6 bg-slate-50 flex flex-col items-center justify-center text-center">
                                    <div class="text-6xl mb-4 drop-shadow-sm">${post.icon}</div>
                                    <p class="text-slate-700 font-medium">${post.content}</p>
                                </div>
                                <div class="p-3 border-t border-slate-100 flex gap-4 text-slate-400 text-sm font-medium">
                                    <span><i class="far fa-heart"></i> 24</span>
                                    <span><i class="far fa-comment"></i> Comment</span>
                                </div>
                            </div>
                            
                            <!-- Comment Input Area -->
                            <div class="bg-indigo-50 rounded-2xl border border-indigo-100 p-4 mt-auto">
                                <p class="text-sm font-bold text-indigo-800 mb-3"><i class="fas fa-pen-nib mr-1"></i> Task: ${post.instruction}</p>
                                <div class="flex gap-2">
                                    <input type="text" id="m1-input" placeholder="Type your comment..." class="flex-1 border-slate-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 outline-none shadow-sm text-sm">
                                    <button id="m1-submit" class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl px-4 flex items-center justify-center transition-colors shadow-sm">
                                        <i class="fas fa-paper-plane"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="mt-4 text-center text-xs text-slate-400">Post ${pIndex + 1} of ${posts.length}</div>
                    </div>
                `;

                const input = document.getElementById('m1-input');
                const submitBtn = document.getElementById('m1-submit');

                const handleComment = () => {
                    const text = input.value.trim();
                    if(!text) return;
                    
                    const analysis = Lingua.checkGerundGrammar(text);
                    
                    // Specific check to ensure they used the requested keyword
                    if (!text.toLowerCase().includes(post.keyword)) {
                        UI.showToast(`Make sure to use the word '${post.keyword.toUpperCase()}'.`, 'error');
                        return;
                    }

                    if (analysis.ok) {
                        UI.showToast("Great comment! Grammar is correct.", "success");
                        UI.updateScore('grammar', 10, 10);
                        UI.updateScore('accuracy', 10, 10);
                        state.currentStep++;
                        setTimeout(() => this.renderMission1(), 1200);
                    } else {
                        UI.showModal(`
                            <div class="text-center p-2">
                                <div class="text-amber-500 text-4xl mb-3"><i class="fas fa-exclamation-circle"></i></div>
                                <h3 class="text-lg font-bold text-slate-800 mb-2">Grammar Check</h3>
                                <p class="text-slate-600 mb-4">${analysis.msg}</p>
                                ${analysis.suggestion ? `<p class="bg-slate-50 border border-slate-200 p-3 rounded-lg text-slate-800 font-medium mb-4">${analysis.suggestion}</p>` : ''}
                                <button onclick="UI.closeModal()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl">Edit Comment</button>
                            </div>
                        `);
                    }
                };

                submitBtn.onclick = handleComment;
                input.onkeypress = (e) => { if(e.key === 'Enter') handleComment(); };
                
                // Auto focus input
                setTimeout(() => input.focus(), 300);
            },

            // ---------------- MISSION 2: TEXT FIXER ----------------
            renderMission2() {
                state.currentMission = 2;
                UI.updateProgress(2);
                
                const textsToFix = [
                    { bad: "I enjoy to listen to music.", target: "I enjoy listening to music." },
                    { bad: "Do you like play video games?", target: "Do you like playing video games?" },
                    { bad: "I hate wait in line.", target: "I hate waiting in line." }
                ];

                let tIndex = state.currentStep || 0;
                if (tIndex >= textsToFix.length) {
                    state.currentStep = 0;
                    this.renderMission3();
                    return;
                }
                
                const item = textsToFix[tIndex];

                DOM.content.innerHTML = `
                    <div class="screen-enter flex flex-col h-full">
                        <div class="mb-4">
                            <h2 class="text-xl font-bold text-slate-800"><i class="fas fa-wrench text-indigo-500 mr-2"></i>Mission 2: Text Fixer</h2>
                            <p class="text-sm text-slate-500 mt-1">Help your friend fix their grammar before they send.</p>
                        </div>
                        
                        <div class="flex-1 bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col">
                            
                            <div class="bg-rose-50 border border-rose-200 rounded-xl p-6 text-center relative mb-8 mt-4">
                                <span class="absolute -top-3 left-1/2 transform -translate-x-1/2 bg-rose-500 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wide shadow-sm">Draft Message</span>
                                <p class="text-xl font-medium text-rose-800 mt-2 line-through decoration-rose-400 decoration-2">"${item.bad}"</p>
                            </div>

                            <div class="flex-1 flex flex-col">
                                <p class="text-sm font-bold text-slate-700 mb-3">Rewrite the message correctly:</p>
                                
                                <textarea id="m2-input" rows="3" class="w-full border border-slate-300 rounded-xl p-4 text-slate-800 focus:ring-2 focus:ring-indigo-500 outline-none resize-none mb-4 shadow-inner" placeholder="Type the correct version here..."></textarea>
                                
                                <div id="m2-feedback-box" class="hidden p-4 rounded-xl mb-4 text-sm font-medium border"></div>
                                
                                <div class="mt-auto flex gap-2">
                                    <button id="m2-submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold shadow-md transition-colors">Check Grammar</button>
                                    <button id="m2-next" class="hidden flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold shadow-md transition-colors">Next <i class="fas fa-arrow-right ml-1"></i></button>
                                </div>
                            </div>
                        </div>
                        <div class="mt-4 text-center text-xs text-slate-400">Message ${tIndex + 1} of ${textsToFix.length}</div>
                    </div>
                `;

                const input = document.getElementById('m2-input');
                const submitBtn = document.getElementById('m2-submit');
                const nextBtn = document.getElementById('m2-next');
                const feedbackBox = document.getElementById('m2-feedback-box');
                
                // Pre-fill to save time, user just changes the verb
                input.value = item.bad;

                const checkFix = () => {
                    const text = input.value.trim();
                    const analysis = Lingua.checkGerundGrammar(text);
                    const accuracyScore = Lingua.calculateAccuracy(item.target, text);
                    
                    feedbackBox.classList.remove('hidden', 'bg-emerald-50', 'text-emerald-700', 'border-emerald-200', 'bg-amber-50', 'text-amber-700', 'border-amber-200');
                    
                    if (analysis.ok && accuracyScore >= 90) {
                        feedbackBox.classList.add('bg-emerald-50', 'text-emerald-700', 'border-emerald-200');
                        feedbackBox.innerHTML = '<i class="fas fa-check-circle mr-1"></i> Perfect! The grammar is correct.';
                        submitBtn.classList.add('hidden');
                        nextBtn.classList.remove('hidden');
                        UI.updateScore('grammar', 10, 10);
                        UI.updateScore('accuracy', 10, 10);
                    } else if (analysis.ok) {
                        feedbackBox.classList.add('bg-amber-50', 'text-amber-700', 'border-amber-200');
                        feedbackBox.innerHTML = '<i class="fas fa-exclamation-triangle mr-1"></i> Grammar is okay, but it doesn\'t match the original meaning closely enough. Try again.';
                    } else {
                        feedbackBox.classList.add('bg-rose-50', 'text-rose-700', 'border-rose-200');
                        feedbackBox.innerHTML = `<i class="fas fa-times-circle mr-1"></i> ${analysis.msg}`;
                    }
                };

                submitBtn.onclick = checkFix;
                
                nextBtn.onclick = () => {
                    state.currentStep++;
                    this.renderMission2();
                };
            },

            // ---------------- MISSION 3: WHATSAPP SIMULATION ----------------
            renderMission3() {
                state.currentMission = 3;
                UI.updateProgress(3);
                
                // Initialize chat state if new
                if(!state.chatData) {
                    state.chatData = {
                        step: 0,
                        messages: [
                            { sender: 'alex', text: `Hi ${state.studentName}! I'm doing a survey. What do you like doing after class?` }
                        ]
                    };
                }

                DOM.content.innerHTML = `
                    <div class="screen-enter flex flex-col h-full bg-[#efeae2]">

            analyzeChatInput(text, step) {
                // Rule set based on current chat step
                const check = Lingua.checkGerundGrammar(text);
                
                if (step === 0 || step === 1 || step === 2) {
                     return check; // Standard pref + gerund check
                } 
                else if (step === 3) {
                    // Expecting a question: "Do you like/enjoy...?"
                    const t = text.toLowerCase();
                    if (!t.includes("do you") || !(t.includes("like") || t.includes("enjoy") || t.includes("love") || t.includes("hate"))) {
                        return { ok: false, msg: "Start your question with 'Do you like...' or 'Do you enjoy...'"};
                    }
                    return check; // Also verify gerund used in question
                }
                return { ok: true };
            },

                        state.chatData.step++;

            },

            startChallenge() {
                const nameInput = document.getElementById('student-name-input');
                const name = nameInput.value.trim();
                if (!name) {
                    UI.showToast("Please enter your name to begin.", "error");
                    nameInput.focus();
                    return;
                }
                state.studentName = name;
                this.saveProgress();
                Screens.renderGrammarDetective();
            },

            addSurveyRow() {
                state.surveyData.push({});
                Screens.renderSurveyTable();
            },

            // Routing
            renderMission1() { Screens.renderMission1(); this.saveProgress(); },
            renderMission2() { Screens.renderMission2(); this.saveProgress(); },
            renderMission3() { Screens.renderMission3(); this.saveProgress(); },
            renderMission4() { Screens.renderMission4(); this.saveProgress(); },
            renderReport() { Screens.renderReport(); this.saveProgress(); },
            renderSurvey() { Screens.renderSurvey(); this.saveProgress(); },

            // Storage
            saveProgress() {
                try { localStorage.setItem('lesson2_chat_state', JSON.stringify(state)); } catch(e) {}
            },
            
            resume() {
                try {
                    const saved = JSON.parse(localStorage.getItem('lesson2_chat_state'));
                    Object.assign(state, saved);
                    if(state.currentMission === 1) Screens.renderMission1();
                    else if(state.currentMission === 2) Screens.renderMission2();
                    else if(state.currentMission === 3) Screens.renderMission3();
                    else if(state.currentMission === 4) Screens.renderMission4();
                    else Screens.renderReport();
                } catch(e) { this.reset(); }
            },

            reset() {
                localStorage.removeItem('lesson2_chat_state');
                location.reload();
            },

            showTeacherMode() {
                const pwd = prompt("Enter Teacher Password:");
                if(pwd === "TEACHER") {
                    UI.showModal(`
                        <div>
                            <h3 class="font-bold text-lg mb-2 text-indigo-700"><i class="fas fa-cog"></i> Teacher Dashboard</h3>
                            <p class="text-xs text-slate-500 mb-4">Lesson 2: Text-Based Likes/Dislikes (A2)</p>
                            
                            <div class="bg-slate-50 p-3 rounded border text-sm mb-4">
                                <p><strong>Target:</strong> like/love/enjoy/hate + V-ing</p>
                                <p><strong>Missions:</strong> 4 (Social Feed, Text Fixer, Chat, Q&A)</p>
                                <p><strong>Current Student:</strong> ${state.studentName || 'None'}</p>
                            </div>
                            
                            <button onclick="app.reset()" class="w-full bg-rose-600 text-white font-bold py-3 rounded-xl mb-2 shadow-md"><i class="fas fa-trash-alt"></i> Reset Session Data</button>
                            <button onclick="UI.closeModal()" class="w-full bg-slate-200 text-slate-700 font-bold py-3 rounded-xl">Close</button>
                        </div>
                    `);
                }
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            app.init();
        });

    </script>
</body>
</html>
